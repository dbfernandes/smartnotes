name: Workflow para testes
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
jobs:
  testes-gerais:
    runs-on: ubuntu-latest
    steps:
      - name: Carregar arquivos
        uses: actions/checkout@v7
      - name: Instalar o node.js
        uses: actions/setup-node@v7
      - name: Instalar dependências
        run: npm ci
      - name: Gerar arquivos do Prisma
        run: npx prisma generate
      - name: Testar tipos typescript
        run: npm run typecheck
      - name: Rodar o ESLint
        run: npm run lint
      - name: Rodar o Prettier
        run: npm run format:check
