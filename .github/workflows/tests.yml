name: Testes para a aula
on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
jobs:
  general-tests:
    runs-on: 
      - 'ubuntu-latest'
    steps:
      - name: Carregar arquivos
        uses: actions/checkout@v7
      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Listar arquivos
        run: pwd
  
