name: Workflow para testes
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
jobs:
  testes-gerais:
    runs-on: 
      - ubuntu-latest
    steps:
      - name: Carregar arquivos
        uses: action/checkout@v7
      - name: Instalar o node.js
        uses: action/setup-node@v7
      - name: Ver diretorio
        run: pwd
