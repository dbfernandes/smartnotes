name: Vitest
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Install NodeJs
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Create enviroment
        run: cp .env.tests .env
      - name: Start services
        run: docker compose up -d --wait api-prod db
      - name: Print containers
        run: docker ps
