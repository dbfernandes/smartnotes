name: Vitest Tests
on:
  pull_request:
    types: ['opened', 'synchronize', 'reopened']
    branches: ['main']
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Carregar arquivos
        uses: actions/checkout@v7
      - name: Instalar NodeJs
        uses: actions/setup-node@v7
        with: 
          node-version: 24
          cache: npm
      - name: Start services
        run: docker compose up -d --wait api-tests db
      - name: Rodar vitest
        run: npm test
