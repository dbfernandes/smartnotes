name: Test Workflow

on: 
  workflow_dispatch: 
jobs: 
  typetest:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate        
      - name: Run type tests
        run: npm run typecheck
