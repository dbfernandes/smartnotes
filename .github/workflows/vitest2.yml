name: Vitest Tests
on:
  pull_request:
    types: ['opened', 'synchronize', 'reopened']
    branches: ['main']
  workflow_dispatch: 
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Carregar arquivos
        uses: actions/checkout@v7
      - name: Setar enviroment
        run: cp .env.tests .env
      - name: Start services
        run: docker compose up -d --wait api-tests db
      - name: Rodar vitest
        run: docker compose exec -T api-tests npm test
